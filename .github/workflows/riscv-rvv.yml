name: Ubuntu RISC-V RVV (QEMU)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc 14, VLEN=128
            packages: g++-14-riscv64-linux-gnu
            cc: riscv64-linux-gnu-gcc-14
            cxx: riscv64-linux-gnu-g++-14
            flags: -march=rv64gcv
            vlen: 128
          - name: gcc 14, VLEN=256
            packages: g++-14-riscv64-linux-gnu
            cc: riscv64-linux-gnu-gcc-14
            cxx: riscv64-linux-gnu-g++-14
            flags: -march=rv64gcv
            vlen: 256
          - name: clang 18, VLEN=128
            packages: g++-riscv64-linux-gnu clang-18
            cc: clang-18
            cxx: clang++-18
            flags: --target=riscv64-linux-gnu -march=rv64gcv
            vlen: 128
          - name: clang 18, VLEN=1024
            packages: g++-riscv64-linux-gnu clang-18
            cc: clang-18
            cxx: clang++-18
            flags: --target=riscv64-linux-gnu -march=rv64gcv
            vlen: 1024
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packages
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -y cmake ninja-build qemu-user-static ${{ matrix.packages }}
      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CFLAGS: ${{ matrix.flags }}
          CXXFLAGS: ${{ matrix.flags }}
        run: |
          cmake -G Ninja --toolchain=cmake/toolchains-ci/riscv64-linux-gnu.cmake \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_ROARING_TESTS=ON -B build
          cmake --build build
      - name: Test
        env:
          QEMU_LD_PREFIX: /usr/riscv64-linux-gnu
          QEMU_CPU: rv64,v=on,vlen=${{ matrix.vlen }},rvv_ta_all_1s=on,rvv_ma_all_1s=on
        run: ctest --timeout 1800 --output-on-failure --test-dir build -j $(nproc)
